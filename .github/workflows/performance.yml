name: Pruebas de rendimiento

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL del entorno de prueba autorizado (nunca producción)"
        required: true
        default: "http://127.0.0.1:8000"

jobs:
  k6:
    name: k6 carga controlada
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Preparar Laravel de prueba
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Instalar y servir entorno de prueba
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          mkdir -p database
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --force
          php artisan serve --host=127.0.0.1 --port=8000 &
          sleep 3

      - name: Ejecutar k6
        env:
          BASE_URL: http://127.0.0.1:8000
        run: k6 run performance/cards-load.js
